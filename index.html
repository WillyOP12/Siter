  <style>
    :root {
      --bg: #050805;
      --bg2: #0b120b;
      --card: rgba(10,20,10,0.92);
      --green: #00ff66;
      --green2: #4fa86b;
      --text: #b7ffcb;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      font-family: "Courier New", monospace;
      color: var(--text);
      background:
        radial-gradient(circle at top, #103018 0%, transparent 40%),
        linear-gradient(180deg, var(--bg), var(--bg2));
    }

    .terminal {
      width: 100%;
      max-width: 560px;
      background: var(--card);
      border: 1px solid var(--green);
      border-radius: 18px;
      padding: 30px;
      box-shadow: 0 0 25px rgba(0,255,102,0.2);
      position: relative;
    }

    .terminal::before {
      content: "SITER TERMINAL";
      position: absolute;
      top: -12px;
      left: 20px;
      background: #000;
      color: var(--green);
      border: 1px solid var(--green);
      border-radius: 999px;
      padding: 2px 10px;
      font-size: 0.8rem;
    }

    h1 {
      margin: 0 0 10px;
      color: var(--green);
      font-size: 2.2rem;
      text-shadow: 0 0 12px rgba(0,255,102,0.5);
    }

    p {
      margin-bottom: 22px;
      color: var(--green2);
      line-height: 1.5;
    }

    label {
      display: block;
      margin: 16px 0 8px;
      color: var(--green);
      text-transform: uppercase;
      font-size: 0.9rem;
      font-weight: bold;
    }

    input {
      width: 100%;
      padding: 13px;
      background: #020402;
      border: 1px solid #1a7a44;
      border-radius: 10px;
      color: var(--text);
      font-size: 1rem;
      font-family: inherit;
      outline: none;
    }

    input:focus {
      border-color: var(--green);
      box-shadow: 0 0 10px rgba(0,255,102,0.3);
    }

    button {
      width: 100%;
      margin-top: 24px;
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--green);
      background: rgba(0,255,102,0.08);
      color: var(--green);
      font-family: inherit;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: rgba(0,255,102,0.16);
      box-shadow: 0 0 18px rgba(0,255,102,0.2);
    }

    .status {
      margin-top: 18px;
      padding: 14px;
      border-radius: 10px;
      background: rgba(0,0,0,0.4);
      border: 1px solid rgba(0,255,102,0.15);
      min-height: 60px;
      word-break: break-word;
    }

    footer {
      margin-top: 22px;
      color: #417e54;
      font-size: 0.85rem;
      text-align: center;
    }
  </style>
</head>

    <p>> Localitzador de Google Sites de l’Institut La Sagrera - Sant Andreu.</p>

    <form id="form">
      <label for="nom">Nom</label>
      <input type="text" id="nom" name="given-name" autocomplete="given-name" required>

      <label for="cognom">Primer cognom</label>
      <input type="text" id="cognom" name="family-name" autocomplete="family-name" required>

      <label for="any">Any de naixement</label>
      <input type="number" id="any" name="bday-year" autocomplete="bday-year" required>

      <button type="submit">Buscar</button>
    </form>

    <div class="status" id="status">Esperant entrada...</div>
  </main>

  <footer>
    Propietat de l’Institut La Sagrera — Sant Andreu, llicència Apache 2.0
  </footer>

  <script>
    const form = document.getElementById('form');
    const statusBox = document.getElementById('status');

    function normalize(text) {
      return text
        .trim()
        .toLowerCase()
        .replace(/ç/g, 'c')
        .replace(/ñ/g, 'n')
        .normalize('NFD')
        .replace(/[\u0300-\u036f]/g, '')
        .replace(/\s+/g, '');
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();

      const nom = normalize(document.getElementById('nom').value);
      const cognom = normalize(document.getElementById('cognom').value);
      const any = document.getElementById('any').value.trim();

      const base = nom[0] + cognom;
      const any2 = any.slice(-2);

      const urlAmbAny = `https://sites.google.com/inslasagrera.cat/${base}${any2}`;
      const urlSenseAny = `https://sites.google.com/inslasagrera.cat/${base}`;

      window.open(urlAmbAny, '_blank');

      statusBox.innerHTML = '>&nbsp;No funciona? <a href="' + urlSenseAny + '" target="_blank" style="color:#00ff66;text-decoration:underline;">Prova sense any</a>';
    });
  </script>
